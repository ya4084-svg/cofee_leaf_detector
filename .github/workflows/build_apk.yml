name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Get dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Disable buggy Lint Vital in Gradle
      - name: Disable Lint Vital Check
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              afterEvaluate { project ->
                  project.tasks.matching { it.name.contains("lintVital") }.configureEach {
                      enabled = false
                  }
              }
          }
          EOF

      # 6. Build Android Release APK
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 7. Upload APK as an Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk