name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Modern Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Gradle Settings
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=ignore" >> ~/.gradle/gradle.properties
          echo "kotlin.jvm.target.validation.mode=ignore" >> android/gradle.properties
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              afterEvaluate { project ->
                  project.tasks.matching { it.name.contains("lintVital") }.configureEach {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk